# dbt connection profile for MediterraneanWillForge.
#
# Adapter: dbt-duckdb, running DuckDB in-process.
# Storage: Silver Delta data files on MinIO.
#
# Required environment variables all default to local MinIO development values:
#   MINIO_HOST        - host:port only, no scheme (default: localhost:9000)
#   MINIO_ACCESS_KEY  - MinIO access key (default: minioadmin)
#   MINIO_SECRET_KEY  - MinIO secret key (default: minioadmin)
#   DBT_DUCKDB_PATH   - DuckDB file path (default: /tmp/med_ops_dbt.duckdb)
#
# The staging model reads Silver Parquet data files through DuckDB httpfs.
# DuckDB 1.0.x delta_scan() does not reliably reuse the configured s3_*
# settings in dbt-duckdb 1.8.0, so direct read_parquet() remains the safer
# MinIO path here.
#
# The DuckDB file path is persisted because dbt compile, run, and test may be
# separate invocations. Do not use :memory: for this profile.

med_ops_fortress:
  target: dev
  outputs:
    dev:
      type: duckdb
      path: "{{ env_var('DBT_DUCKDB_PATH', '/tmp/med_ops_dbt.duckdb') }}"
      extensions:
        - httpfs
      settings:
        s3_endpoint: "{{ env_var('MINIO_HOST', 'localhost:9000') }}"
        s3_access_key_id: "{{ env_var('MINIO_ACCESS_KEY', 'minioadmin') }}"
        s3_secret_access_key: "{{ env_var('MINIO_SECRET_KEY', 'minioadmin') }}"
        s3_use_ssl: "{{ env_var('S3_USE_SSL', 'false') }}"
        s3_url_style: "path"
