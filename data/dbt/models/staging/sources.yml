version: 2

sources:
  - name: silver
    description: >
      Silver layer containing cleaned, type-enforced, WHO-2021-flagged air
      quality records written by data/ingestion/silver/transformer.py. The
      table is stored on MinIO at s3://silver/air_quality and partitioned by
      partition_date and source.
    schema: silver

    tables:
      - name: air_quality
        description: >
          Unified Silver Delta table for the openmeteo and openaq real data
          sources. Each row represents one station or grid point for one
          observation date and source.
        meta:
          delta_table_path: "s3://silver/air_quality"
          read_strategy: "read_parquet via DuckDB httpfs"

        columns:
          - name: station_id
            description: "Unique station or grid-point identifier."
          - name: station_name
            description: "Human-readable station name."
          - name: city
            description: "City name when provided by the source."
          - name: country_code
            description: "ISO-3166-1 alpha-2 country code."
          - name: latitude
            description: "WGS-84 latitude."
          - name: longitude
            description: "WGS-84 longitude."
          - name: date
            description: "Observation date string, YYYY-MM-DD."
          - name: pm2_5
            description: "PM2.5 daily mean in micrograms per cubic meter."
          - name: pm10
            description: "PM10 daily mean in micrograms per cubic meter."
          - name: nitrogen_dioxide
            description: "Nitrogen dioxide daily mean in micrograms per cubic meter."
          - name: ozone
            description: "Ozone daily mean in micrograms per cubic meter."
          - name: aqi_category
            description: "US EPA PM2.5 AQI tier."
          - name: who_pm25_exceed
            description: "1 if PM2.5 exceeds the WHO 2021 daily guideline."
          - name: who_pm10_exceed
            description: "1 if PM10 exceeds the WHO 2021 daily guideline."
          - name: who_no2_exceed
            description: "1 if nitrogen dioxide exceeds the WHO 2021 daily guideline."
          - name: who_o3_exceed
            description: "1 if ozone exceeds the WHO 2021 daily guideline."
          - name: data_completeness
            description: "Fraction of canonical pollutant columns that are non-null."
          - name: source
            description: "Canonical data source identifier: openmeteo or openaq."
          - name: silver_ts
            description: "UTC timestamp when the row was written to Silver."
          - name: partition_date
            description: "Delta partition key, YYYY-MM-DD."
