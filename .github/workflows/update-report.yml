name: Update Report Images

on:
  workflow_run:
    workflows: ["Pipeline — Full Run (Bronze → Silver → Gold)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: update-report-images
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update-report:
    name: Run Notebook and Commit Report Artifacts
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MINIO_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
      MINIO_BUCKET_GOLD: med-ops-mohamed-gold
      AWS_REGION: eu-central-003
      MINIO_ACCESS_KEY: ${{ secrets.B2_KEY_ID }}
      MINIO_SECRET_KEY: ${{ secrets.B2_APP_KEY }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/ingestion/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r docker/ingestion/requirements.txt
          pip install matplotlib numpy python-dotenv nbconvert nbformat ipykernel

      - name: Execute report notebook
        working-directory: docs
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute pipeline_report.ipynb \
            --output pipeline_report \
            --ExecutePreprocessor.timeout=900

      - name: Render report HTML
        working-directory: docs
        run: |
          jupyter nbconvert \
            --to html pipeline_report.ipynb \
            --output pipeline_report

      - name: Commit updated report artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/pipeline_report.ipynb \
            docs/pipeline_report.html \
            docs/reporting_readiness.csv \
            docs/coverage_heatmap.png \
            docs/who_exceedance.png \
            docs/wildfire_risk.png \
            docs/pollutants_by_country.png \
            docs/anomaly_detection.png \
            docs/source_coverage.png
          if git diff --cached --quiet; then
            echo "No report artifact changes to commit."
          else
            git commit -m "chore: update report artifacts"
            git push
          fi
