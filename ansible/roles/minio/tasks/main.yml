---
# minio/tasks/main.yml — Deploy MinIO as the local lakehouse object store

- name: Create MinIO data directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: medops
    group: medops
    mode: "0755"
  loop:
    - /data/minio
    - /data/minio/bronze
    - /data/minio/silver
    - /data/minio/gold

- name: Deploy MinIO via Docker
  community.docker.docker_container:
    name: minio
    image: quay.io/minio/minio:latest
    state: started
    restart_policy: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    env:
      MINIO_ROOT_USER: "{{ minio_access_key | default('minioadmin') }}"
      MINIO_ROOT_PASSWORD: "{{ minio_secret_key | default('minioadmin') }}"
    volumes:
      - /data/minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

- name: Wait for MinIO to be healthy
  ansible.builtin.uri:
    url: http://localhost:9000/minio/health/live
    status_code: 200
  register: minio_health
  until: minio_health.status == 200
  retries: 10
  delay: 5
