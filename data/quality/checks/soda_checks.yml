# Mediterranean Ops Fortress — Soda data quality checks
# Applied to the Bronze Copernicus table after each ingestion run.

checks for copernicus_air_quality:

  # ── Completeness ────────────────────────────────────────────────────────────
  - row_count > 0:
      name: bronze_has_rows
      fail: when < 1

  - missing_count(station_id) = 0:
      name: station_id_not_null

  - missing_count(pm2p5) < 10%:
      name: pm25_null_rate_acceptable

  # ── Freshness ───────────────────────────────────────────────────────────────
  - freshness(ingestion_ts) < 26h:
      name: bronze_freshness

  # ── Range validity ──────────────────────────────────────────────────────────
  - min(pm2p5) >= 0:
      name: pm25_non_negative

  - max(pm2p5) <= 10000:
      name: pm25_within_plausible_range

  - min(latitude)  >= -90:
      name: lat_valid_min
  - max(latitude)  <=  90:
      name: lat_valid_max
  - min(longitude) >= -180:
      name: lon_valid_min
  - max(longitude) <=  180:
      name: lon_valid_max

  # ── Schema ──────────────────────────────────────────────────────────────────
  - schema:
      name: bronze_schema_check
      warn:
        when schema changes: any
      fail:
        when schema changes: column delete
