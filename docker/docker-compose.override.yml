# docker-compose.override.yml - local development only
#
# Adds MinIO and creates the bronze/silver/gold buckets so local jobs can run
# without Backblaze B2 credentials.

volumes:
  minio_data:

services:

  minio:
    # MinIO's own images no longer pull anonymously. Bitnami's frozen build
    # does, and it creates the buckets on first boot.
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20
    container_name: med-ops-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_DEFAULT_BUCKETS: bronze,silver,gold
      MINIO_PROMETHEUS_AUTH_TYPE: public
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - fortress
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3

  ingestion:
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_BRONZE: bronze
      MINIO_BUCKET_SILVER: silver
      MINIO_BUCKET_GOLD: gold
    depends_on:
      minio:
        condition: service_healthy

  quality:
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET_BRONZE: bronze
      MINIO_BUCKET_SILVER: silver
      MINIO_BUCKET_GOLD: gold
    depends_on:
      minio:
        condition: service_healthy
