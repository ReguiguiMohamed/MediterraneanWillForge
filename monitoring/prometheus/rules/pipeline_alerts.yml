groups:
  - name: data_pipeline
    interval: 60s
    rules:

      # ── Data freshness ──────────────────────────────────────────────────────
      - alert: BronzeLayerStale
        expr: >
          (time() - pipeline_last_successful_run_timestamp{layer="bronze"}) > 90000
        for: 5m
        labels:
          severity: warning
          layer: bronze
        annotations:
          summary: "Bronze layer has not been updated in >25 hours"
          description: >
            Last successful bronze ingestion was {{ $value | humanizeDuration }} ago.
            Expected cadence: daily. Check ingestion container logs.

      - alert: SilverLayerStale
        expr: >
          (time() - pipeline_last_successful_run_timestamp{layer="silver"}) > 93600
        for: 5m
        labels:
          severity: warning
          layer: silver
        annotations:
          summary: "Silver transformation has not run in >26 hours"
          description: >
            Last successful silver run was {{ $value | humanizeDuration }} ago.
            Silver runs after bronze — verify bronze completed successfully.

      - alert: GoldLayerStale
        expr: >
          (time() - pipeline_last_successful_run_timestamp{layer="gold"}) > 97200
        for: 5m
        labels:
          severity: warning
          layer: gold
        annotations:
          summary: "Gold marts have not been rebuilt in >27 hours"
          description: >
            Last gold mart build was {{ $value | humanizeDuration }} ago.
            Gold depends on silver — check the full pipeline execution order.

      - alert: QualityChecksStale
        expr: >
          (time() - pipeline_last_quality_run_timestamp) > 93600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Quality checks have not run in >26 hours"
          description: >
            Last quality check run was {{ $value | humanizeDuration }} ago for
            layer {{ $labels.layer }}. Quality container may have exited early.

      # ── Row count anomalies ─────────────────────────────────────────────────
      - alert: BronzeRowCountDrop
        expr: >
          pipeline_ingested_rows{layer="bronze"}
          < pipeline_ingested_rows{layer="bronze"} offset 1d * 0.5
        for: 10m
        labels:
          severity: warning
          layer: bronze
        annotations:
          summary: "Bronze row count dropped >50% vs yesterday (source: {{ $labels.source }})"
          description: >
            Ingested {{ $value }} rows for source {{ $labels.source }} today vs
            expected baseline. Possible upstream API degradation or rate-limiting.

      # ── Quality gate failures ───────────────────────────────────────────────
      - alert: DataQualityCheckFailed
        expr: pipeline_quality_check_failures_total > 0
        for: 1m
        labels:
          severity: pipeline
        annotations:
          summary: "Data quality check failed: {{ $labels.check_name }}"
          description: >
            {{ $value }} failure(s) on check '{{ $labels.check_name }}'
            in layer '{{ $labels.layer }}'. Investigate quality runner logs.

      # ── Pipeline duration ───────────────────────────────────────────────────
      - alert: BronzeIngestSlow
        expr: >
          pipeline_duration_seconds{stage=~"bronze_(openmeteo|openaq)"} > 1800
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Bronze ingest ({{ $labels.stage }}) taking unusually long"
          description: >
            Stage {{ $labels.stage }} took {{ $value | humanizeDuration }}.
            Expected under 30 minutes. Possible API timeout or MinIO write bottleneck.

      - alert: SilverTransformSlow
        expr: pipeline_duration_seconds{stage="silver_transform"} > 3600
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Silver transformation taking >1 hour"
          description: >
            Silver transform took {{ $value | humanizeDuration }}.
            May indicate large partition backlog or Delta write contention.
