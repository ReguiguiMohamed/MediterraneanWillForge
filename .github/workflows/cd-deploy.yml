name: CD — Publish Images

# Triggered manually or automatically when Docker/data code changes on main.
# Builds and pushes versioned images to GitHub Container Registry (ghcr.io).
# Infrastructure (Terraform/Ansible) targets a local Vagrant VM — no remote
# state exists, so Terraform is NOT executed in CI. Run it locally:
#   make tf-apply   →  provisions local Docker resources
#   make provision  →  runs Ansible against the Vagrant VM

on:
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "data/ingestion/**"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build only, no push)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  REPO:     ${{ github.repository }}

jobs:
  publish-ingestion:
    name: Build & Publish Ingestion Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/ingestion
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ingestion image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/ingestion/Dockerfile
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  publish-quality:
    name: Build & Publish Quality Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.REPO }}/quality
          tags: |
            type=sha,prefix=sha-
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push quality image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/quality/Dockerfile
          push: ${{ github.event.inputs.dry_run != 'true' }}
          tags:   ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
