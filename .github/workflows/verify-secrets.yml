name: Verify Secrets

# Lightweight credential probe — no data reads or writes.
# Run this any time you rotate or update B2 / Grafana secrets to confirm
# the new values are valid before the next scheduled pipeline run.
# Takes ~30 seconds.

on:
  workflow_dispatch:

jobs:
  verify:
    name: Probe B2 + Grafana credentials
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install probe dependencies
        run: pip install requests boto3

      - name: Verify B2 credentials
        env:
          MINIO_ACCESS_KEY: ${{ secrets.B2_KEY_ID }}
          MINIO_SECRET_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          python - <<'EOF'
          import os, sys, boto3
          from botocore.exceptions import ClientError, NoCredentialsError

          key_id  = os.environ.get("MINIO_ACCESS_KEY", "").strip()
          app_key = os.environ.get("MINIO_SECRET_KEY", "").strip()

          missing = [k for k, v in {"B2_KEY_ID": key_id, "B2_APP_KEY": app_key}.items() if not v]
          if missing:
              print(f"::error::B2 secret(s) not set: {', '.join(missing)}")
              sys.exit(1)

          s3 = boto3.client(
              "s3",
              endpoint_url="https://s3.eu-central-003.backblazeb2.com",
              aws_access_key_id=key_id,
              aws_secret_access_key=app_key,
              region_name="eu-central-003",
          )
          try:
              buckets = [b["Name"] for b in s3.list_buckets().get("Buckets", [])]
              expected = {"med-ops-mohamed-bronze", "med-ops-mohamed-silver", "med-ops-mohamed-gold"}
              found    = expected & set(buckets)
              missing_b = expected - set(buckets)
              if missing_b:
                  print(f"::warning::B2 credentials valid but bucket(s) not found: {missing_b}")
              print(f"B2 credentials: OK — buckets visible: {sorted(found)}")
          except ClientError as exc:
              code = exc.response["Error"]["Code"]
              if code in ("InvalidAccessKeyId", "SignatureDoesNotMatch", "AccessDenied"):
                  print(f"::error::B2 credentials rejected ({code}). Check B2_KEY_ID and B2_APP_KEY.")
                  sys.exit(1)
              print(f"::error::B2 probe failed: {exc}")
              sys.exit(1)
          except NoCredentialsError:
              print("::error::B2 credentials missing or empty.")
              sys.exit(1)
          EOF

      - name: Verify Grafana Cloud credentials
        env:
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_METRICS_ID:       ${{ secrets.GRAFANA_METRICS_ID }}
          GRAFANA_TOKEN:            ${{ secrets.GRAFANA_TOKEN }}
        run: |
          python - <<'EOF'
          import os, sys, base64, requests

          g_url = os.environ.get("GRAFANA_REMOTE_WRITE_URL", "").strip()
          g_uid = os.environ.get("GRAFANA_METRICS_ID", "").strip()
          g_tok = os.environ.get("GRAFANA_TOKEN", "").strip()

          grafana_vars = {
              "GRAFANA_REMOTE_WRITE_URL": g_url,
              "GRAFANA_METRICS_ID":       g_uid,
              "GRAFANA_TOKEN":            g_tok,
          }
          set_vars   = [k for k, v in grafana_vars.items() if v]
          unset_vars = [k for k, v in grafana_vars.items() if not v]

          if not set_vars:
              print("Grafana secrets: not configured — skipping probe")
              sys.exit(0)

          if unset_vars:
              print(f"::error::Grafana partially configured. Missing: {', '.join(unset_vars)}")
              sys.exit(1)

          creds = base64.b64encode(f"{g_uid}:{g_tok}".encode()).decode()
          try:
              resp = requests.post(
                  g_url,
                  data=b"",
                  headers={
                      "Authorization": f"Basic {creds}",
                      "Content-Type": "application/x-protobuf",
                  },
                  timeout=10,
              )
          except requests.exceptions.ConnectionError as exc:
              print(f"::error::Cannot reach Grafana remote_write URL: {exc}")
              sys.exit(1)
          except requests.exceptions.Timeout:
              print("::error::Grafana remote_write URL timed out. Check GRAFANA_REMOTE_WRITE_URL.")
              sys.exit(1)

          if resp.status_code == 401:
              print("::error::Grafana credentials rejected (401). Check GRAFANA_METRICS_ID and GRAFANA_TOKEN.")
              sys.exit(1)
          if resp.status_code == 403:
              print("::error::Grafana token lacks required scope (403). Token needs 'metrics:write'.")
              sys.exit(1)
          if resp.status_code == 404:
              print("::error::Grafana remote_write URL not found (404). GRAFANA_REMOTE_WRITE_URL is wrong.")
              print("::error::Expected format: https://prometheus-XXXXXX.grafana.net/api/prom/push")
              print(f"::error::Got: {g_url}")
              sys.exit(1)
          if resp.status_code not in (200, 204, 400, 415, 422):
              print(f"::error::Unexpected response from Grafana: HTTP {resp.status_code} — {resp.text[:300]}")
              sys.exit(1)

          print(f"Grafana credentials: OK (HTTP {resp.status_code})")
          EOF

      - name: Summary
        if: success()
        run: echo "All configured secrets verified successfully."
