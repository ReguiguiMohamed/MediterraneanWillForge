version: 2

models:
  - name: mart_daily_air_quality
    description: >
      Daily air quality summary per country, source, and AQI tier. This table
      aggregates station-level Silver readings through stg_air_quality for
      analytics and dashboard consumption.
    columns:
      - name: observation_date
        description: "Calendar date of the aggregated readings."
        tests:
          - not_null

      - name: country_code
        description: "ISO-3166-1 alpha-2 country code."
        tests:
          - not_null

      - name: source
        description: "Canonical data source identifier."
        tests:
          - not_null
          - accepted_values:
              values: [openmeteo, openaq, waqi]

      - name: dominant_aqi_tier
        description: "AQI category grouping key for the aggregate row."
        tests:
          - not_null
          - accepted_values:
              values:
                - good
                - moderate
                - unhealthy_sensitive
                - unhealthy
                - very_unhealthy
                - hazardous
                - unknown

      - name: station_count
        description: "Number of distinct stations contributing to the aggregate."
        tests:
          - not_null
          - accepted_range:
              min_value: 1

      - name: daily_mean_pm2_5
        description: "Mean PM2.5 across all stations for this group."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 1000

      - name: daily_max_pm2_5
        description: "Maximum PM2.5 across all stations for this group."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 1000

      - name: daily_mean_pm10
        description: "Mean PM10 across all stations for this group."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 2000

      - name: daily_mean_nitrogen_dioxide
        description: "Mean nitrogen dioxide across all stations for this group."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 500

      - name: daily_mean_ozone
        description: "Mean ozone across all stations for this group."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 500

      - name: who_pm25_exceed_pct
        description: "Percentage of stations exceeding the WHO PM2.5 guideline."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 100

      - name: who_pm10_exceed_pct
        description: "Percentage of stations exceeding the WHO PM10 guideline."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 100

      - name: who_no2_exceed_pct
        description: "Percentage of stations exceeding the WHO nitrogen dioxide guideline."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 100

      - name: who_o3_exceed_pct
        description: "Percentage of stations exceeding the WHO ozone guideline."
        tests:
          - accepted_range:
              min_value: 0
              max_value: 100

      - name: mean_data_completeness
        description: "Average data completeness across all stations in the aggregate."
        tests:
          - not_null
          - accepted_range:
              min_value: 0
              max_value: 1

      - name: mart_ts
        description: "Timestamp when this row was materialized."
        tests:
          - not_null

  - name: mart_city_weekly_trend
    description: >
      City-level daily PM2.5 and ozone means with trailing seven-day averages.
      Built for readable static analytics and README/report charts.
    columns:
      - name: observation_date
        tests:
          - not_null
      - name: country_code
        tests:
          - not_null
      - name: city_name
        tests:
          - not_null
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: [openmeteo, openaq, waqi]
      - name: station_count
        tests:
          - not_null
          - accepted_range:
              min_value: 1
      - name: rolling_7d_pm2_5
        tests:
          - accepted_range:
              min_value: 0
              max_value: 1000
      - name: rolling_7d_ozone
        tests:
          - accepted_range:
              min_value: 0
              max_value: 500
      - name: mart_ts
        tests:
          - not_null

  - name: mart_source_coverage
    description: >
      Date, country, and source coverage table showing station counts,
      reading counts, and pollutant availability percentages.
    columns:
      - name: observation_date
        tests:
          - not_null
      - name: country_code
        tests:
          - not_null
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: [openmeteo, openaq, waqi]
      - name: station_count
        tests:
          - not_null
          - accepted_range:
              min_value: 1
      - name: mean_data_completeness
        tests:
          - not_null
          - accepted_range:
              min_value: 0
              max_value: 1
      - name: pm2_5_available_pct
        tests:
          - accepted_range:
              min_value: 0
              max_value: 100
      - name: mart_ts
        tests:
          - not_null

  - name: mart_who_exceedance_streak
    description: >
      Station-day streak table tracking consecutive days where at least one WHO
      daily pollutant guideline is exceeded.
    columns:
      - name: observation_date
        tests:
          - not_null
      - name: station_id
        tests:
          - not_null
      - name: country_code
        tests:
          - not_null
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: [openmeteo, openaq, waqi]
      - name: has_who_exceedance
        tests:
          - accepted_values:
              values: [0, 1]
              quote: false
      - name: current_exceedance_streak_days
        tests:
          - not_null
          - accepted_range:
              min_value: 0
      - name: mart_ts
        tests:
          - not_null
