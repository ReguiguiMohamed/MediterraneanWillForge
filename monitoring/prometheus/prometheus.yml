# Mediterranean Ops Fortress — Prometheus Configuration
# Every service is scraped. Every anomaly is caught. No blind spots.

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    environment: local
    region:      TN-MED
    project:     med-ops-fortress

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
      timeout: 10s

rule_files:
  - /etc/prometheus/rules/infra_alerts.yml
  - /etc/prometheus/rules/pipeline_alerts.yml

scrape_configs:

  # ── Self-monitoring ──────────────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
        labels:
          service: prometheus

  # ── Pushgateway (batch job metrics) ─────────────────────────────────────────
  - job_name: pushgateway
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          service: pushgateway

  # ── MinIO cluster metrics ────────────────────────────────────────────────────
  - job_name: minio
    metrics_path: /minio/v2/metrics/cluster
    scheme: http
    static_configs:
      - targets: ["minio:9000"]
        labels:
          service: minio

  # ── cAdvisor (container resource usage) ─────────────────────────────────────
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          service: cadvisor

  # ── Node Exporter (host-level metrics inside Vagrant VM) ────────────────────
  - job_name: node_exporter
    static_configs:
      - targets: ["192.168.56.10:9100"]
        labels:
          service:  node_exporter
          hostname: med-ops-fortress-vm
