---
# Mediterranean Ops Fortress — Master Playbook
# Targets an OCI ARM VM provisioned by Terraform.
# Applies all roles in dependency order.

- name: Mediterranean Ops Fortress — Full Stack Provisioning
  hosts: fortress
  become: true
  gather_facts: true

  vars_files:
    - "vars/common.yml"

  pre_tasks:
    - name: Confirm target host
      ansible.builtin.debug:
        msg: "Provisioning {{ inventory_hostname }} — forging the fortress."

  roles:
    - role: common          # Base OS hardening, user setup, system packages
    - role: docker          # Docker Engine + Docker Compose plugin
    - role: prometheus      # Prometheus + Pushgateway + alert rules
    - role: alertmanager    # Alertmanager with routing config
    - role: grafana         # Grafana with provisioned datasources + dashboards

  post_tasks:
    - name: Run health check
      ansible.builtin.command: "bash {{ project_root | default('/opt/med-ops-fortress') }}/scripts/healthcheck.sh"
      register: healthcheck_result
      changed_when: false

    - name: Display health check output
      ansible.builtin.debug:
        var: healthcheck_result.stdout_lines
