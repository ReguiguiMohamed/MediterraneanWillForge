---
# prometheus/tasks/main.yml — Deploy Prometheus + Pushgateway + node_exporter

- name: Create Prometheus config directory
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /etc/prometheus
    - /etc/prometheus/rules

- name: Template Prometheus configuration
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    mode: "0644"
  notify: Restart Prometheus

- name: Copy alert rules
  ansible.builtin.copy:
    src: "{{ project_root }}/monitoring/prometheus/rules/"
    dest: /etc/prometheus/rules/
    mode: "0644"
  notify: Restart Prometheus

- name: Deploy Prometheus container
  community.docker.docker_container:
    name: prometheus
    image: "{{ docker_prometheus_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: med-ops-net
    ports:
      - "9090:9090"
    volumes:
      - /etc/prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time={{ prometheus_retention_days }}d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"

- name: Deploy Pushgateway container
  community.docker.docker_container:
    name: pushgateway
    image: "{{ docker_pushgateway_image }}"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: med-ops-net
    ports:
      - "9091:9091"

- name: Deploy node_exporter container
  community.docker.docker_container:
    name: node_exporter
    image: "{{ docker_node_exporter_image }}"
    state: started
    restart_policy: unless-stopped
    network_mode: host
    pid_mode: host
    volumes:
      - /:/host:ro,rslave
    command:
      - "--path.rootfs=/host"
