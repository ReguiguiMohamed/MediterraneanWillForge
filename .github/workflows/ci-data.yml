name: CI — Data Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "data/**"
      - "docker/**"
      - "tests/**"
      - "requirements*.txt"
      - "Makefile"
      - ".github/workflows/ci-data.yml"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "docker/**"
      - "tests/**"
      - "requirements*.txt"
      - "Makefile"
      - ".github/workflows/ci-data.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check data/ tests/

      - name: Check formatting with black
        run: black --check --diff data/ tests/

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=data --cov-report=xml --cov-report=term-missing

      - name: Install dbt in an isolated environment
        run: |
          python -m venv .dbt-venv
          .dbt-venv/bin/python -m pip install --upgrade pip
          .dbt-venv/bin/pip install -r requirements-dbt.txt

      - name: dbt compile (SQL syntax check — no data required)
        run: |
          .dbt-venv/bin/dbt compile \
            --profiles-dir data/dbt \
            --project-dir data/dbt

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        run: |
          docker compose -f docker/docker-compose.yml config --quiet
          docker compose \
            -f docker/docker-compose.yml \
            -f docker/docker-compose.override.yml \
            config --quiet

      - name: Build ingestion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ingestion/Dockerfile
          push: false
          tags: med-ops-ingestion:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build quality image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/quality/Dockerfile
          push: false
          tags: med-ops-quality:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-images
    env:
      PYTHONPATH: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # MinIO's images on Docker Hub and quay.io no longer pull anonymously,
      # so CI runs Bitnami's frozen build, pinned by digest.
      - name: Start MinIO
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            bitnamilegacy/minio:2025.7.23-debian-12-r5@sha256:6dabb4a2088c9a79908de3bc05f4586c23ad2182c8908e7e3acbf61c1467fb20

      - name: Wait for MinIO to be healthy
        run: |
          for i in $(seq 1 12); do
            curl -sf http://localhost:9000/minio/health/live && echo "MinIO ready." && break
            echo "Waiting for MinIO ($i/12)..."
            sleep 5
          done

      # The AWS CLI ships on the runner image. Retries cover the restart
      # Bitnami's entrypoint does after its first boot.
      - name: Create lakehouse buckets
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: |
          for bucket in bronze silver gold; do
            for i in $(seq 1 10); do
              aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket "$bucket" 2>/dev/null && break
              aws --endpoint-url http://localhost:9000 s3 mb "s3://$bucket" && break
              sleep 3
            done
            aws --endpoint-url http://localhost:9000 s3api head-bucket --bucket "$bucket"
          done

      - name: Run integration tests
        env:
          MINIO_ENDPOINT:   http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          PIPELINE_ENV:     ci
          PROMETHEUS_PUSHGATEWAY_URL: http://localhost:9091
        run: pytest tests/integration/ -v --tb=short

      - name: Run Silver transformer (Bronze → Silver)
        env:
          MINIO_ENDPOINT:              http://localhost:9000
          MINIO_ACCESS_KEY:            minioadmin
          MINIO_SECRET_KEY:            minioadmin
          PROMETHEUS_PUSHGATEWAY_URL:  http://localhost:9091
        run: python -c "from data.ingestion.silver.transformer import run; run()"

      - name: Run Silver weather transformer (Bronze → Silver)
        env:
          MINIO_ENDPOINT:              http://localhost:9000
          MINIO_ACCESS_KEY:            minioadmin
          MINIO_SECRET_KEY:            minioadmin
          PROMETHEUS_PUSHGATEWAY_URL:  http://localhost:9091
        run: python -c "from data.ingestion.silver.weather import run; run()"

      - name: Inspect MinIO silver layout
        # Shows exact file paths — confirms Silver data exists and glob depth is correct.
        env:
          AWS_ACCESS_KEY_ID: minioadmin
          AWS_SECRET_ACCESS_KEY: minioadmin
          AWS_DEFAULT_REGION: us-east-1
        run: aws --endpoint-url http://localhost:9000 s3 ls --recursive s3://silver/air_quality/ | head -20

      - name: Verify Silver layer has rows
        # Fails loudly here rather than letting dbt silently report "no files found".
        env:
          MINIO_ENDPOINT:   http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
        run: python tests/ci_verify_silver.py

      - name: Run Gold marts (Silver → Gold)
        env:
          MINIO_ENDPOINT:              http://localhost:9000
          MINIO_ACCESS_KEY:            minioadmin
          MINIO_SECRET_KEY:            minioadmin
          PROMETHEUS_PUSHGATEWAY_URL:  http://localhost:9091
          # Fixtures are dated January 2024; the rolling window would exclude
          # every one of them and leave Gold with nothing to build.
          GOLD_WINDOW_DAYS:            all
        run: python -c "from data.ingestion.gold.marts import run; run()"

      - name: Run Gold anomaly detection
        env:
          MINIO_ENDPOINT:              http://localhost:9000
          MINIO_ACCESS_KEY:            minioadmin
          MINIO_SECRET_KEY:            minioadmin
          PROMETHEUS_PUSHGATEWAY_URL:  http://localhost:9091
          # Fixtures are dated January 2024; the rolling window would exclude
          # every one of them and leave Gold with nothing to build.
          GOLD_WINDOW_DAYS:            all
        run: python -c "from data.ingestion.gold.anomaly import run; run()"

      - name: Verify Gold layer tables
        # Verifies every retained Gold Delta output against its contract.
        env:
          MINIO_ENDPOINT:   http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          MINIO_BUCKET_GOLD: gold
        run: python -m data.quality.verify_outputs

      - name: Install dbt in an isolated environment
        run: |
          python -m venv .dbt-venv
          .dbt-venv/bin/python -m pip install --upgrade pip
          .dbt-venv/bin/pip install -r requirements-dbt.txt

      - name: dbt run + test (Silver → dbt views/tables)
        env:
          MINIO_HOST:        localhost:9000
          MINIO_ACCESS_KEY:  minioadmin
          MINIO_SECRET_KEY:  minioadmin
          DBT_DUCKDB_PATH:   /tmp/med_ops_dbt.duckdb
        run: |
          .dbt-venv/bin/dbt run \
            --profiles-dir data/dbt \
            --project-dir data/dbt
          .dbt-venv/bin/dbt test \
            --profiles-dir data/dbt \
            --project-dir data/dbt
