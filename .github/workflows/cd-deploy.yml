name: CD — Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: local
        type: choice
        options: [local, staging]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-infrastructure:
    name: Deploy Infrastructure (Terraform + Ansible)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: ${{ github.event.inputs.environment || 'local' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        run: terraform -chdir=terraform/environments/local init
        env:
          TF_VAR_minio_access_key:       ${{ secrets.MINIO_ACCESS_KEY }}
          TF_VAR_minio_secret_key:       ${{ secrets.MINIO_SECRET_KEY }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

      - name: Terraform Apply
        run: terraform -chdir=terraform/environments/local apply -auto-approve
        env:
          TF_VAR_minio_access_key:       ${{ secrets.MINIO_ACCESS_KEY }}
          TF_VAR_minio_secret_key:       ${{ secrets.MINIO_SECRET_KEY }}
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}

  trigger-ingestion:
    name: Trigger Daily Ingestion
    runs-on: ubuntu-latest
    needs: deploy-infrastructure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and run bronze ingestion
        run: |
          docker build -t med-ops-ingestion:latest \
            -f docker/ingestion/Dockerfile .
          docker run --rm \
            -e MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }} \
            -e MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }} \
            -e MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }} \
            -e CAMS_API_KEY=${{ secrets.CAMS_API_KEY }} \
            -e PUSHGATEWAY_URL=${{ secrets.PUSHGATEWAY_URL }} \
            med-ops-ingestion:latest \
            python -m ingestion.bronze.copernicus_ingestor

      - name: Run silver transformation
        run: |
          docker run --rm \
            -e MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }} \
            -e MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }} \
            -e MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }} \
            -e PUSHGATEWAY_URL=${{ secrets.PUSHGATEWAY_URL }} \
            med-ops-ingestion:latest \
            python -m ingestion.silver.transformer

      - name: Run data quality checks
        run: |
          docker build -t med-ops-quality:latest \
            -f docker/quality/Dockerfile .
          docker run --rm \
            -e MINIO_ENDPOINT=${{ secrets.MINIO_ENDPOINT }} \
            -e MINIO_ACCESS_KEY=${{ secrets.MINIO_ACCESS_KEY }} \
            -e MINIO_SECRET_KEY=${{ secrets.MINIO_SECRET_KEY }} \
            med-ops-quality:latest
