#cloud-config
# Minimal bootstrap — Ansible handles all service configuration.
package_update: true
package_upgrade: false
packages:
  - curl
  - git
  - python3-pip
  - python3-venv

runcmd:
  # OCI Ubuntu images block all ingress by default via iptables — open the
  # observability ports so Ansible and the stack are reachable immediately.
  - iptables -I INPUT -p tcp -m multiport --dports 22,3000,8080,9090,9091,9093,9100 -j ACCEPT
  - netfilter-persistent save
