groups:
  - name: data_pipeline
    interval: 60s
    rules:
      - alert: OpenMeteoRunStale
        expr: time() - med_ops_bronze_openmeteo_last_run_ts > 90000
        for: 5m
        labels:
          severity: warning
          layer: bronze
        annotations:
          summary: "Open-Meteo ingestion has not completed in over 25 hours"
          description: "Last completion was {{ $value | humanizeDuration }} ago."

      - alert: SilverRunStale
        expr: time() - med_ops_silver_last_run_ts > 93600
        for: 5m
        labels:
          severity: warning
          layer: silver
        annotations:
          summary: "Silver transformation has not completed in over 26 hours"
          description: "Last completion was {{ $value | humanizeDuration }} ago."

      - alert: GoldRunStale
        expr: time() - med_ops_gold_mart_last_run_ts > 97200
        for: 5m
        labels:
          severity: warning
          layer: gold
        annotations:
          summary: "Gold marts have not completed in over 27 hours"
          description: "Last completion was {{ $value | humanizeDuration }} ago."

      - alert: QualityChecksStale
        expr: time() - pipeline_last_quality_run_timestamp > 93600
        for: 5m
        labels:
          severity: warning
          layer: quality
        annotations:
          summary: "Quality checks have not completed in over 26 hours"
          description: "Last completion was {{ $value | humanizeDuration }} ago."

      - alert: OpenMeteoRowCountDrop
        expr: |
          med_ops_bronze_openmeteo_rows
          < med_ops_bronze_openmeteo_rows offset 1d * 0.5
        for: 10m
        labels:
          severity: warning
          layer: bronze
        annotations:
          summary: "Open-Meteo row count dropped by more than 50%"
          description: "Current row count is {{ $value }}."

      - alert: OpenAQReturnedNoRows
        expr: med_ops_bronze_openaq_rows < 1
        for: 1m
        labels:
          severity: warning
          layer: bronze
        annotations:
          summary: "OpenAQ ingestion returned no rows"
          description: "OpenAQ is optional, but a zero-row run may indicate upstream sparsity or rate limiting."

      - alert: DataQualityCheckFailed
        expr: pipeline_quality_check_failures_total > 0
        for: 1m
        labels:
          severity: pipeline
        annotations:
          summary: "Data quality check failed: {{ $labels.check_name }}"
          description: "{{ $value }} failure(s) in layer {{ $labels.layer }}."

      - alert: BronzeIngestSlow
        expr: |
          max(
            {__name__=~"med_ops_bronze_(openmeteo|openaq|waqi)_duration_seconds"}
          ) > 1800
        for: 5m
        labels:
          severity: warning
          layer: bronze
        annotations:
          summary: "A Bronze ingestion stage took over 30 minutes"
          description: "Longest observed duration is {{ $value | humanizeDuration }}."

      - alert: SilverTransformSlow
        expr: med_ops_silver_duration_seconds > 3600
        for: 5m
        labels:
          severity: warning
          layer: silver
        annotations:
          summary: "Silver transformation took over one hour"
          description: "Observed duration is {{ $value | humanizeDuration }}."
