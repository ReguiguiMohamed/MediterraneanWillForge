name: CI — Infrastructure

on:
  push:
    branches: [main, develop]
    paths:
      - "terraform/**"
      - "ansible/**"
      - "monitoring/prometheus/**"
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - "monitoring/prometheus/**"

jobs:
  terraform-validate:
    name: Terraform Validate & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Check formatting
        run: terraform fmt -check -recursive terraform/

      # Validate from the root module — modules are called from here,
      # not validated in isolation (they require provider configuration).
      - name: Terraform Init (root, no backend)
        run: terraform -chdir=terraform init -backend=false

      - name: Terraform Validate
        run: terraform -chdir=terraform validate

      - name: Install tflint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.51.1

      - name: Run tflint
        working-directory: terraform
        run: |
          tflint --init
          tflint

  ansible-lint:
    name: Ansible Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ansible and lint tooling
        run: pip install ansible ansible-lint

      # Collections must be present before ansible-lint can resolve module names.
      - name: Install Ansible Galaxy collections
        run: ansible-galaxy collection install -r ansible/requirements.yml

      - name: Lint site playbook
        run: ansible-lint ansible/site.yml

  prometheus-validate:
    name: Validate Prometheus Config & Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prometheus.yml
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.51.0 \
            promtool check config /etc/prometheus/prometheus.yml

      - name: Check alert rule files
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/monitoring/prometheus/rules:/rules:ro" \
            prom/prometheus:v2.51.0 \
            promtool check rules \
              /rules/infra_alerts.yml \
              /rules/pipeline_alerts.yml
