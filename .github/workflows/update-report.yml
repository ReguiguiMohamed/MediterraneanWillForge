name: Report — Build and Publish

# Executes the report notebook against the live Gold layer and publishes the
# result straight to GitHub Pages.
#
# The generated artifacts (HTML, executed notebook, PNGs, CSV) are deliberately
# NOT committed back to main.  Doing that added ~1.7 MB of binary churn per day
# — regenerated HTML and notebooks do not delta-compress — and had grown to 99%
# of the repository's git history.  Pages is built from a workflow artifact, so
# the files never need to exist in a commit at all.

on:
  workflow_run:
    workflows: ["Pipeline — Full Run (Bronze → Silver → Gold)"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-report:
    name: Run Notebook and Stage Report Site
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      MINIO_ENDPOINT: https://s3.eu-central-003.backblazeb2.com
      MINIO_BUCKET_GOLD: med-ops-mohamed-gold
      AWS_REGION: eu-central-003
      MINIO_ACCESS_KEY: ${{ secrets.B2_KEY_ID }}
      MINIO_SECRET_KEY: ${{ secrets.B2_APP_KEY }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-report.txt

      - name: Install dependencies
        run: pip install -r requirements-report.txt

      - name: Execute report notebook
        working-directory: docs
        run: |
          jupyter nbconvert \
            --to notebook \
            --execute pipeline_report.ipynb \
            --output pipeline_report \
            --ExecutePreprocessor.timeout=900

      - name: Render report HTML
        working-directory: docs
        run: |
          jupyter nbconvert \
            --to html pipeline_report.ipynb \
            --output pipeline_report

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage report site
        run: |
          mkdir -p _site/assets
          cp docs/pipeline_report.html _site/index.html
          cp docs/reporting_readiness.csv _site/reporting_readiness.csv
          cp docs/*.png _site/assets/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Portfolio Report
    runs-on: ubuntu-latest
    needs: build-report
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
