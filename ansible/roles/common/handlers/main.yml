---
# common/handlers/main.yml
# Shared restart handlers — container names must match those in the deploy tasks.

- name: Restart Prometheus
  community.docker.docker_container:
    name: prometheus
    state: started
    restart: true

- name: Restart Alertmanager
  community.docker.docker_container:
    name: alertmanager
    state: started
    restart: true

- name: Restart Grafana
  community.docker.docker_container:
    name: grafana
    state: started
    restart: true

- name: Restart MinIO
  community.docker.docker_container:
    name: minio
    state: started
    restart: true
