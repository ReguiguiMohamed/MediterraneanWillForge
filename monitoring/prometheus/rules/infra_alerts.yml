groups:
  - name: local_infrastructure
    interval: 30s
    rules:
      - alert: LocalServiceDown
        expr: up{job=~"pushgateway|minio|cadvisor"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Local service {{ $labels.job }} is down"
          description: "{{ $labels.instance }} has been unreachable for more than 2 minutes."

      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name=~"med-ops-.*"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.name }}"
          description: "Container CPU usage is {{ $value | printf \"%.1f\" }}%."

      - alert: ContainerHighMemory
        expr: |
          (
            container_memory_working_set_bytes{name=~"med-ops-.*"}
            /
            container_spec_memory_limit_bytes{name=~"med-ops-.*"}
          ) * 100 > 85
          and
          container_spec_memory_limit_bytes{name=~"med-ops-.*"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.name }}"
          description: "Container memory usage is {{ $value | printf \"%.1f\" }}%."
