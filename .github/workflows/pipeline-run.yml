name: Pipeline — Full Run (Bronze → Silver → Gold)

# Runs all three pipeline stages against real Backblaze B2 storage.
# Triggers:
#   - Daily at 06:00 UTC (cron)
#   - Manually from the Actions tab (workflow_dispatch)
# Required secrets: B2_KEY_ID, B2_APP_KEY
# Optional secrets: GRAFANA_REMOTE_WRITE_URL, GRAFANA_METRICS_ID, GRAFANA_TOKEN
#   When all three are set, metrics are pushed to Grafana Cloud after each stage.
#   If any are missing the pipeline runs normally without metrics push.
# Backfill: set backfill_start + backfill_end to process a date range.
#   Bronze loops over every date in the range; Silver and Gold run once
#   after all Bronze dates are loaded (they are incremental).

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date to ingest (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        default: ""
      backfill_start:
        description: "Backfill start (YYYY-MM-DD). Pair with backfill_end for a date range."
        required: false
        default: ""
      backfill_end:
        description: "Backfill end (YYYY-MM-DD, inclusive). Pair with backfill_start."
        required: false
        default: ""

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24:  "true"
  MINIO_ENDPOINT:                      https://s3.eu-central-003.backblazeb2.com
  MINIO_BUCKET_BRONZE:                 med-ops-mohamed-bronze
  MINIO_BUCKET_SILVER:                 med-ops-mohamed-silver
  MINIO_BUCKET_GOLD:                   med-ops-mohamed-gold
  AWS_REGION:                          eu-central-003
  PROMETHEUS_PUSHGATEWAY_URL:          http://localhost:9091
  TARGET_DATE:                         ${{ inputs.target_date }}
  BACKFILL_START:                      ${{ inputs.backfill_start }}
  BACKFILL_END:                        ${{ inputs.backfill_end }}
  OPENAQ_API_KEY:                      ${{ secrets.OPENAQ_API_KEY }}
  GRAFANA_REMOTE_WRITE_URL:            ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
  GRAFANA_METRICS_ID:                  ${{ secrets.GRAFANA_METRICS_ID }}
  GRAFANA_TOKEN:                       ${{ secrets.GRAFANA_TOKEN }}

jobs:
  run-pipeline:
    name: Full Pipeline Run
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r docker/ingestion/requirements.txt

      - name: Verify secrets
        run: |
          python - <<'EOF'
          import os, sys, base64, requests

          # ── B2 secrets (required) ──────────────────────────────────────────────
          b2_id  = os.environ.get("MINIO_ACCESS_KEY", "").strip()
          b2_key = os.environ.get("MINIO_SECRET_KEY", "").strip()
          b2_missing = [k for k, v in {"B2_KEY_ID": b2_id, "B2_APP_KEY": b2_key}.items() if not v]
          if b2_missing:
              print(f"::error::Required B2 secret(s) not set: {', '.join(b2_missing)}")
              sys.exit(1)
          print("B2 secrets: present")

          # ── Grafana secrets (optional — skip push if absent, fail if partial) ──
          g_url = os.environ.get("GRAFANA_REMOTE_WRITE_URL", "").strip()
          g_uid = os.environ.get("GRAFANA_METRICS_ID", "").strip()
          g_tok = os.environ.get("GRAFANA_TOKEN", "").strip()
          grafana_vars = {"GRAFANA_REMOTE_WRITE_URL": g_url, "GRAFANA_METRICS_ID": g_uid, "GRAFANA_TOKEN": g_tok}
          set_vars   = [k for k, v in grafana_vars.items() if v]
          unset_vars = [k for k, v in grafana_vars.items() if not v]

          if not set_vars:
              print("Grafana secrets: not configured — metrics push disabled")
              sys.exit(0)

          if unset_vars:
              print(f"::error::Grafana partially configured. Set all three or none.")
              print(f"::error::Missing: {', '.join(unset_vars)}")
              sys.exit(1)

          # All three set — verify credentials with a live probe
          creds = base64.b64encode(f"{g_uid}:{g_tok}".encode()).decode()
          try:
              resp = requests.post(
                  g_url,
                  data=b"",
                  headers={"Authorization": f"Basic {creds}", "Content-Type": "application/x-protobuf"},
                  timeout=10,
              )
          except requests.exceptions.ConnectionError as exc:
              print(f"::error::Cannot reach Grafana remote_write URL: {exc}")
              sys.exit(1)
          except requests.exceptions.Timeout:
              print(f"::error::Grafana remote_write URL timed out after 10s — check GRAFANA_REMOTE_WRITE_URL")
              sys.exit(1)

          if resp.status_code == 401:
              print("::error::Grafana credentials rejected (401). Check GRAFANA_METRICS_ID and GRAFANA_TOKEN.")
              sys.exit(1)
          if resp.status_code == 403:
              print("::error::Grafana token lacks required scope (403). Token needs 'metrics:write'.")
              sys.exit(1)
          if resp.status_code == 404:
              print("::error::Grafana remote_write URL not found (404). GRAFANA_REMOTE_WRITE_URL is wrong.")
              print("::error::Expected format: https://prometheus-XXXXXX.grafana.net/api/prom/push")
              print(f"::error::Got: {g_url}")
              sys.exit(1)
          if resp.status_code not in (200, 204, 400, 415, 422):
              print(f"::error::Unexpected response from Grafana: HTTP {resp.status_code} — {resp.text[:300]}")
              sys.exit(1)

          # 400/415/422 = body format rejected but auth passed — credentials valid
          print(f"Grafana credentials: verified (HTTP {resp.status_code})")
          EOF
        env:
          MINIO_ACCESS_KEY: ${{ secrets.B2_KEY_ID }}
          MINIO_SECRET_KEY: ${{ secrets.B2_APP_KEY }}

      - name: Compute target dates
        run: |
          python - <<'EOF'
          import os
          from datetime import date, timedelta

          start = os.environ.get("BACKFILL_START", "").strip()
          end_s = os.environ.get("BACKFILL_END", "").strip()
          td    = os.environ.get("TARGET_DATE", "").strip()

          if start and end_s:
              d, end_d, dates = date.fromisoformat(start), date.fromisoformat(end_s), []
              while d <= end_d:
                  dates.append(str(d))
                  d += timedelta(days=1)
          elif td:
              dates = [td]
          else:
              dates = [str(date.today() - timedelta(days=1))]

          print(f"Pipeline will process {len(dates)} date(s): {dates[0]} … {dates[-1]}")
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"PIPELINE_DATES={' '.join(dates)}\n")
          EOF

      - name: Bronze — Open-Meteo (12 Mediterranean cities)
        env:
          MINIO_ACCESS_KEY: ${{ secrets.B2_KEY_ID }}
          MINIO_SECRET_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          for d in $PIPELINE_DATES; do
            echo "=== copernicus: $d ==="
            python -c "
          from datetime import date
          from data.ingestion.bronze.copernicus_ingestor import run
          run(date.fromisoformat('$d'))
          "
          done

      - name: Bronze — OpenAQ (10 Mediterranean / North African countries)
        env:
          MINIO_ACCESS_KEY: ${{ secrets.B2_KEY_ID }}
          MINIO_SECRET_KEY: ${{ secrets.B2_APP_KEY }}
        run: |
          python - <<'EOF'
          import os
          from datetime import date
          from data.ingestion.bronze.openaq_ingestor import run, run_range

          start = os.environ.get("BACKFILL_START", "").strip()
          end_s = os.environ.get("BACKFILL_END", "").strip()
          td    = os.environ.get("TARGET_DATE", "").strip()

          if start and end_s:
              # Backfill: one API pass for the full range — 500 sensor calls total
              # instead of 500 × N calls. Reduces 30-day backfill from ~16h to ~20min.
              print(f"=== openaq: range {start} → {end_s} ===")
              run_range(date.fromisoformat(start), date.fromisoformat(end_s))
          elif td:
              print(f"=== openaq: {td} ===")
              run(date.fromisoformat(td))
          else:
              run()
          EOF

      - name: Silver — Transform (Bronze → Silver)
        env:
          MINIO_ACCESS_KEY: ${{ secrets.B2_KEY_ID }}
          MINIO_SECRET_KEY: ${{ secrets.B2_APP_KEY }}
        run: python -c "from data.ingestion.silver.transformer import run; run()"

      - name: Gold — Build marts (Silver → Gold)
        env:
          MINIO_ACCESS_KEY: ${{ secrets.B2_KEY_ID }}
          MINIO_SECRET_KEY: ${{ secrets.B2_APP_KEY }}
        run: python -c "from data.ingestion.gold.marts import run; run()"
