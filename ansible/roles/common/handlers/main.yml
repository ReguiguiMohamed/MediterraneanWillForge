---
# common/handlers/main.yml
# Shared restart handlers. Roles notify these by name.

- name: Restart Prometheus
  community.docker.docker_container:
    name: "{{ project_name }}-prometheus"
    state: started
    restart: true

- name: Restart Alertmanager
  community.docker.docker_container:
    name: "{{ project_name }}-alertmanager"
    state: started
    restart: true

- name: Restart Grafana
  community.docker.docker_container:
    name: "{{ project_name }}-grafana"
    state: started
    restart: true

- name: Restart MinIO
  community.docker.docker_container:
    name: "{{ project_name }}-minio"
    state: started
    restart: true
