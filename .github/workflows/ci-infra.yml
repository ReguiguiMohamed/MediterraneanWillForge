name: CI — Infrastructure

on:
  push:
    branches: [main, develop]
    paths:
      - "monitoring/**"
      - ".github/workflows/ci-infra.yml"
  pull_request:
    branches: [main]
    paths:
      - "monitoring/**"
      - ".github/workflows/ci-infra.yml"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prometheus-validate:
    name: Validate Prometheus Config & Rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check prometheus.yml
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "${{ github.workspace }}/monitoring/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v2.51.0 \
            check config /etc/prometheus/prometheus.yml

      - name: Check alert rule files
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            -v "${{ github.workspace }}/monitoring/prometheus/rules:/rules:ro" \
            prom/prometheus:v2.51.0 \
            check rules \
              /rules/infra_alerts.yml \
              /rules/pipeline_alerts.yml

      - name: Check Alertmanager config
        run: |
          docker run --rm \
            --entrypoint /bin/amtool \
            -v "${{ github.workspace }}/monitoring/alertmanager:/etc/alertmanager:ro" \
            prom/alertmanager:v0.27.0 \
            check-config /etc/alertmanager/alertmanager.yml
