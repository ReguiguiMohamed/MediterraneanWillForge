name: Pages — Publish Portfolio Report

on:
  push:
    branches: [main]
    paths:
      - "docs/pipeline_report.html"
      - "docs/reporting_readiness.csv"
      - "docs/*.png"
      - ".github/workflows/pages.yml"
  workflow_run:
    workflows: ["Update Report Images"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build Pages Artifact
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage report site
        run: |
          mkdir -p _site/assets
          cp docs/pipeline_report.html _site/index.html
          cp docs/reporting_readiness.csv _site/reporting_readiness.csv
          cp docs/*.png _site/assets/
          touch _site/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy Portfolio Report
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
