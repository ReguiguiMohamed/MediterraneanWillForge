# Mediterranean Ops Fortress — Soda data quality checks
# Applied to the Silver air quality table after each transformation run.
# Column names follow the Silver canonical schema (pm2_5, nitrogen_dioxide, ozone).

checks for air_quality:

  # ── Completeness ────────────────────────────────────────────────────────────
  - row_count > 0:
      name: silver_has_rows
      fail: when < 1

  - missing_count(station_id) = 0:
      name: station_id_not_null

  - missing_count(country_code) < 10%:
      name: country_code_mostly_present

  - missing_count(pm2_5) < 50%:
      name: pm25_null_rate_acceptable

  - missing_count(pm10) < 50%:
      name: pm10_null_rate_acceptable

  # ── Freshness ───────────────────────────────────────────────────────────────
  - freshness(silver_ts) < 26h:
      name: silver_freshness

  # ── Range validity ──────────────────────────────────────────────────────────
  - min(pm2_5) >= 0:
      name: pm25_non_negative

  - max(pm2_5) <= 1000:
      name: pm25_within_plausible_range

  - min(pm10) >= 0:
      name: pm10_non_negative

  - max(pm10) <= 2000:
      name: pm10_within_plausible_range

  - min(nitrogen_dioxide) >= 0:
      name: no2_non_negative

  - min(ozone) >= 0:
      name: o3_non_negative

  - min(latitude)  >= -90:
      name: lat_valid_min
  - max(latitude)  <=  90:
      name: lat_valid_max
  - min(longitude) >= -180:
      name: lon_valid_min
  - max(longitude) <=  180:
      name: lon_valid_max

  # ── Categorical validity ────────────────────────────────────────────────────
  - invalid_count(aqi_category) = 0:
      name: aqi_category_valid_values
      valid values:
        [good, moderate, unhealthy_sensitive, unhealthy, very_unhealthy, hazardous, unknown]

  - invalid_count(source) = 0:
      name: source_valid_values
      valid values: [openmeteo, openaq, waqi]

  # ── Data completeness score ─────────────────────────────────────────────────
  - min(data_completeness) >= 0.2:
      name: min_completeness_met

  # ── Schema ──────────────────────────────────────────────────────────────────
  - schema:
      name: silver_schema_check
      warn:
        when schema changes: any
      fail:
        when schema changes: column delete
