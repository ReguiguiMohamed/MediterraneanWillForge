# MediterraneanWillForge Alertmanager configuration for local development.
#
# This file is used when running docker-compose locally.
# Webhook URLs below are intentional stubs — local dev does not send real alerts.
#
# Hosted pipeline alerts are configured in Grafana Cloud. This local
# file exists only to validate routing behavior and support local development.
#
# Routing intent:
#   critical              → infra_critical   (fast: 10 s wait, 1 h repeat)
#   severity=pipeline     → pipeline_ops     (quality gate failures)
#   severity=warning
#     + layer label       → pipeline_ops     (freshness / row-count anomalies)
#   everything else       → infra_ops        (infra warnings, slow stages)

global:
  resolve_timeout: 5m

# ---------------------------------------------------------------------------
# Top-level route
# ---------------------------------------------------------------------------
route:
  group_by: [alertname, layer, severity, environment]
  group_wait:      30s
  group_interval:  5m
  repeat_interval: 4h
  receiver: infra_ops

  routes:
    - matchers:
        - severity = critical
      receiver: infra_critical
      group_wait:      10s
      group_interval:  2m
      repeat_interval: 1h

    - matchers:
        - severity = pipeline
      receiver: pipeline_ops
      group_wait:      1m
      group_interval:  5m
      repeat_interval: 2h

    - matchers:
        - severity = warning
        - layer =~ "bronze|silver|gold"
      receiver: pipeline_ops
      group_wait:      2m
      group_interval:  10m
      repeat_interval: 4h

# ---------------------------------------------------------------------------
# Receivers — localhost stubs for local dev only
# ---------------------------------------------------------------------------
receivers:
  - name: infra_ops
    webhook_configs:
      - url: "http://localhost:5001/alerts"
        send_resolved: true

  - name: infra_critical
    webhook_configs:
      - url: "http://localhost:5001/critical"
        send_resolved: true

  - name: pipeline_ops
    webhook_configs:
      - url: "http://localhost:5001/pipeline"
        send_resolved: true
