name: CI — Data Pipeline

on:
  push:
    branches: [main, develop]
    paths:
      - "data/**"
      - "docker/ingestion/**"
      - "docker/quality/**"
      - "tests/**"
  pull_request:
    branches: [main]
    paths:
      - "data/**"
      - "tests/**"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-unit-tests:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/ingestion/requirements.txt

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r docker/ingestion/requirements.txt
          pip install "ruff==0.15.10" "black==26.3.1" pytest pytest-cov

      - name: Lint with ruff
        run: ruff check data/ tests/

      - name: Check formatting with black
        run: black --check data/ tests/

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ -v --tb=short \
            --cov=data --cov-report=xml --cov-report=term-missing

      - name: dbt compile (SQL syntax check — no data required)
        run: |
          cd data/dbt
          dbt compile --profiles-dir . --project-dir .

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unit
          fail_ci_if_error: false

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: lint-and-unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ingestion image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/ingestion/Dockerfile
          push: false
          tags: med-ops-ingestion:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build quality image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/quality/Dockerfile
          push: false
          tags: med-ops-quality:ci
          cache-from: type=gha
          cache-to:   type=gha,mode=max

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: docker/ingestion/requirements.txt

      - name: Install dependencies
        run: pip install -r docker/ingestion/requirements.txt pytest

      # GitHub Actions service containers do not reliably support CMD overrides,
      # so MinIO is started manually with its full command.
      - name: Start MinIO
        run: |
          docker run -d --name minio-ci \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest \
            server /data --console-address ":9001"

      - name: Wait for MinIO to be healthy
        run: |
          for i in $(seq 1 12); do
            curl -sf http://localhost:9000/minio/health/live && echo "MinIO ready." && break
            echo "Waiting for MinIO ($i/12)..."
            sleep 5
          done

      - name: Create lakehouse buckets
        run: |
          docker run --rm --network host \
            --entrypoint /bin/sh \
            minio/mc:latest -c "
              mc alias set local http://localhost:9000 minioadmin minioadmin && \
              mc mb --ignore-existing local/bronze && \
              mc mb --ignore-existing local/silver && \
              mc mb --ignore-existing local/gold
            "

      - name: Run integration tests
        env:
          MINIO_ENDPOINT:   http://localhost:9000
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          PIPELINE_ENV:     ci
          PROMETHEUS_PUSHGATEWAY_URL: http://localhost:9091
        run: pytest tests/integration/ -v --tb=short

      - name: Run Silver transformer (Bronze → Silver)
        env:
          MINIO_ENDPOINT:              http://localhost:9000
          MINIO_ACCESS_KEY:            minioadmin
          MINIO_SECRET_KEY:            minioadmin
          PROMETHEUS_PUSHGATEWAY_URL:  http://localhost:9091
        run: python -c "from data.ingestion.silver.transformer import run; run()"

      - name: Verify Silver layer has rows
        # Fail fast here rather than letting dbt silently find no files.
        # Also prints the exact file layout so glob issues are immediately visible.
        run: |
          docker run --rm --network host \
            --entrypoint /bin/sh minio/mc:latest -c "
              mc alias set local http://localhost:9000 minioadmin minioadmin &&
              echo '=== MinIO silver/air_quality ===' &&
              mc ls --recursive local/silver/air_quality | head -20
            "
          python -c "
from deltalake import DeltaTable
opts = {
    'endpoint_url':             'http://localhost:9000',
    'aws_access_key_id':        'minioadmin',
    'aws_secret_access_key':    'minioadmin',
    'aws_allow_http':           'true',
    'aws_s3_allow_unsafe_rename': 'true',
}
dt  = DeltaTable('s3://silver/air_quality', storage_options=opts)
df  = dt.to_pandas()
print(f'Silver rows   : {len(df)}')
print(f'Columns       : {sorted(df.columns.tolist())}')
print(f'partition_date: {sorted(df[\"partition_date\"].unique().tolist())}')
assert len(df) > 0, 'Silver layer is empty after transformer run'
print('Silver verification PASSED')
"

      - name: Run Gold marts (Silver → Gold)
        env:
          MINIO_ENDPOINT:              http://localhost:9000
          MINIO_ACCESS_KEY:            minioadmin
          MINIO_SECRET_KEY:            minioadmin
          PROMETHEUS_PUSHGATEWAY_URL:  http://localhost:9091
        run: python -c "from data.ingestion.gold.marts import run; run()"

      - name: dbt run + test (Silver → dbt views/tables)
        env:
          MINIO_HOST:        localhost:9000
          MINIO_ACCESS_KEY:  minioadmin
          MINIO_SECRET_KEY:  minioadmin
          DBT_DUCKDB_PATH:   /tmp/med_ops_dbt.duckdb
        run: |
          cd data/dbt
          dbt run   --profiles-dir . --project-dir .
          dbt test  --profiles-dir . --project-dir .
