# Mediterranean Ops Fortress — Alertmanager Configuration
# Every alert is routed with intent. No noise, no missed signals.

global:
  resolve_timeout: 5m

route:
  group_by:       ["alertname", "layer", "severity"]
  group_wait:     30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: default

  routes:
    - match:
        severity: critical
      receiver: critical
      group_wait: 10s
      repeat_interval: 1h

    - match:
        severity: pipeline
      receiver: pipeline_team
      group_wait: 1m

receivers:
  - name: default
    webhook_configs:
      - url: "http://localhost:5001/alerts"
        send_resolved: true

  - name: critical
    webhook_configs:
      - url: "http://localhost:5001/critical"
        send_resolved: true

  - name: pipeline_team
    webhook_configs:
      - url: "http://localhost:5001/pipeline"
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: critical
    target_match:
      severity: warning
    equal: ["alertname"]
